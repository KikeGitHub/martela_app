name: Desplegar Demo MARTELA en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar aplicación demo
        uses: actions/upload-pages-artifact@v3
        with:
          # Despliega directamente el contenido de workspace/demo en la raíz del dominio
          path: 'workspace/demo'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
