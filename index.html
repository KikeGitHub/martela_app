<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=workspace/demo/">
  <title>MARTELA — Plataforma Operativa Integral</title>
  <link rel="icon" type="image/svg+xml" href="workspace/demo/assets/icons/favicon.svg">
  <script>
    window.location.replace("workspace/demo/");
  </script>
  <style>
    body {
      background-color: #e5e7eb;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 2rem 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      max-width: 420px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #9c7c2b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #9c7c2b;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 0.5rem; font-size: 1.15rem; font-weight: 800;">MARTELA</h2>
    <p style="margin: 0 0 1rem; font-size: 0.875rem; color: #4b5563;">Iniciando Plataforma Operativa...</p>
    <p style="margin: 0; font-size: 0.75rem; color: #6b7280;">
      Si no redirige automáticamente en unos segundos, <a href="workspace/demo/">haz clic aquí</a>.
    </p>
  </div>
</body>
</html>
